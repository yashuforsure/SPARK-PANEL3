name: Build SPARK External Panel App

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Compile and Package External Panel Standalone IPA
        run: |
          mkdir -p build_app/Payload/SPARKPanel.app
          
          xcrun -sdk iphoneos clang -arch arm64 -miphoneos-version-min=14.0 \
            -fobjc-arc -Iios_external_panel_app -c ios_external_panel_app/main.m -o main.o

          xcrun -sdk iphoneos clang -arch arm64 -miphoneos-version-min=14.0 \
            -fobjc-arc -Iios_external_panel_app -c ios_external_panel_app/AppDelegate.m -o AppDelegate.o

          xcrun -sdk iphoneos clang++ -arch arm64 -miphoneos-version-min=14.0 \
            -std=c++17 -fobjc-arc -Iios_external_panel_app -c ios_external_panel_app/ExternalPanelViewController.mm -o ExternalPanelViewController.o

          xcrun -sdk iphoneos clang++ -arch arm64 -miphoneos-version-min=14.0 \
            -framework UIKit -framework Foundation -framework WebKit -framework Security \
            main.o AppDelegate.o ExternalPanelViewController.o \
            -o build_app/Payload/SPARKPanel.app/SPARKPanel

          cp ios_external_panel_app/Info.plist build_app/Payload/SPARKPanel.app/Info.plist
          cp ios_external_panel_app/index.html build_app/Payload/SPARKPanel.app/index.html
          cp ios_external_panel_app/app.js build_app/Payload/SPARKPanel.app/app.js
          cp ios_external_panel_app/style.css build_app/Payload/SPARKPanel.app/style.css

          mkdir -p packages
          cd build_app
          zip -r ../packages/SPARK_External_Panel.ipa Payload/
          cd ..

      - name: Upload External Panel IPA
        uses: actions/upload-artifact@v4
        with:
          name: SPARK_External_Panel_IPA
          path: packages/SPARK_External_Panel.ipa
